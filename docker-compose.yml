name: m_api
services: 
  db: 
    image: postgres:16-alpine   
    ports: 
      - "21110:5432"
    environment: 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data                    # named volume: persists Postgres's data dir across container restarts/rebuilds
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro # bind mount: exposes this host file inside the container, read-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The app's runtime connection (DB_URL) goes through PgBouncer; migrations and
  # admin work stay on db directly. The image never overwrites a mounted ini, so
  # its environment variables (POOL_MODE etc.) would do nothing — the ini is it.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    ports:
      - "21111:6432"                                       # container side = listen_port in the ini
    volumes:
      # The directory, not the two files: editors and sed -i replace a file with a
      # new one, and a single-file bind mount keeps showing the container the old
      # one. With the directory mounted, edit the ini, then RELOAD on the console.
      - ./pgbouncer:/etc/pgbouncer:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # A real query through the pool: it reaches Postgres, so it fails when db is
      # down. pg_isready alone would only prove PgBouncer itself is listening.
      # Right for compose --wait. In Kubernetes (#28) this check is the readiness
      # probe; liveness checks PgBouncer alone, or a db outage restarts it for nothing.
      test: ["CMD-SHELL", "PGPASSWORD=pgbouncer-auth-dev-only psql -h 127.0.0.1 -p 6432 -U pgbouncer_auth -d shop -tAc 'SELECT 1' | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The Pact broker keeps contracts and verification results in its own Postgres,
  # never the app's db. No published port: only the broker talks to it.
  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact-broker-dev-only
      POSTGRES_DB: pact_broker
    volumes:
      - pact-broker-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker -d pact_broker"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Local only, without authentication: anyone who can reach 21112 can publish.
  pact-broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - "21112:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact-broker-dev-only@pact-broker-db/pact_broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost can resolve to
      # IPv6, and the broker listens on IPv4 only.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The broker for order.placed (HW#19). Dev-only credentials, like db's above. The
  # policies (dead-lettering, delivery limit) aren't here: scripts/rabbitmq-policies.sh
  # sets them with rabbitmqctl, because a definitions file loaded at boot would skip
  # the default user and vhost below.
  rabbitmq:
    image: rabbitmq:4.3.7-management
    # The node name, and so the data directory, comes from the hostname. A fixed one
    # keeps the volume's queues visible across container recreation.
    hostname: rabbitmq
    ports:
      - "21113:5672"                                       # AMQP
      - "21114:15672"                                      # management UI and HTTP API, not AMQP
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: rabbitmq-dev-only
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # The node accepts commands, not just an open port: right after boot the
      # port is open while connections still get ECONNRESET.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Two Redis instances, because maxmemory and the eviction policy are per instance
  # (SELECT 1 on one instance would share both). No password: dev-only, and the
  # ports listen on 127.0.0.1 only.
  #
  # The cache: refilled from the database, so nothing worth keeping. A small
  # maxmemory (a dev setting a demo fills in seconds; production sizes it from real
  # data) with allkeys-lru, and no persistence at all.
  redis-cache:
    image: redis:8.10.3-alpine
    command: >
      redis-server
      --maxmemory 32mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "127.0.0.1:21115:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The queue (BullMQ jobs, and sessions): an evicted or lost key is a lost job or
  # a logged-out user. noeviction (a full instance refuses writes instead of
  # dropping keys), AOF fsynced every second, on a volume. The maxmemory makes a
  # runaway queue fail with clean OOM errors instead of growing until the
  # container is killed (dev size; production sizes it from the backlog it must hold).
  redis-queue:
    image: redis:8.10.3-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:21116:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Object storage (HW#26): Garage, an S3-compatible store (MinIO's free edition has
  # been unmaintained since December 2025). One node, S3 API on 127.0.0.1:21117.
  #
  # The bootstrap is Garage's own (v2.3+): --single-node assigns the node a layout role,
  # and --default-bucket creates the access key and the bucket below and grants the key
  # read/write/owner on it. The data is on a tmpfs, so each start begins empty and
  # bootstraps again: a second `up` or a `down`/`up` can't trip over leftovers.
  # The bucket is private: no website mode, no anonymous access (an unsigned GET → 403).
  #
  # The credentials are dev-only bootstrap values, like the DB passwords above: the
  # app gets its copy from the secrets store (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in
  # .secrets/infisical.dev.env), never from this file.
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: 2a4be25db6a986d7d68be58efcc35f2cb584c89acabe56d32555ed3005a511f9
      GARAGE_DEFAULT_ACCESS_KEY: GK11af531b79412bf2c74a8cba
      GARAGE_DEFAULT_SECRET_KEY: 0689921fc5c9befe010e47aa684a1b369453a110be5401c9bb8a40ce44fc62b9
      GARAGE_DEFAULT_BUCKET: hw26-files
      # The admin API (port 3903, not published: only garage-edge-key below calls it).
      GARAGE_ADMIN_TOKEN: jH9WxfAb9S5njl9VRL9108X55voCjtcwyg3f6eY-3dk
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    # At least 1g: a full tmpfs kills the store mid-run.
    tmpfs:
      - /var/lib/garage:size=1g
    ports:
      - "127.0.0.1:21117:3900"
    # Healthy only once the bucket exists: the image has no shell or curl, so the probe
    # is Garage's own CLI, which fails until the bootstrap has created the bucket.
    # `up --wait` returns only then.
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "hw26-files"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The edge's own read-only key (Phase E), set up after every store start: the store
  # bootstraps only one key (the app's), and its data is on a tmpfs. It imports the key if
  # it's missing and grants it read on the bucket (garage/edge-key.sh), then stays up and
  # reports healthy, so `up --wait` waits for the key (an exited one-shot fails --wait). Dev-only bootstrap values, like the ones above;
  # the edge reads its copy from the secrets store (EDGE_S3_ACCESS_KEY_ID / _SECRET_ACCESS_KEY).
  garage-edge-key:
    image: curlimages/curl:8.23.0
    depends_on:
      garage:
        condition: service_healthy
        restart: true
    environment:
      GARAGE_ADMIN_TOKEN: jH9WxfAb9S5njl9VRL9108X55voCjtcwyg3f6eY-3dk
      EDGE_KEY_ID: GK7082f94f405bed0b295b08df
      EDGE_SECRET_KEY: a49bb7af817d425e0b2754c7c7ec5a93a9baf8cae8751a4d018cc06e3c2630ce
      BUCKET: hw26-files
    volumes:
      - ./garage/edge-key.sh:/edge-key.sh:ro
    entrypoint: ["sh", "/edge-key.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/edge-key-ready"]
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
  pact-broker-data:
  rabbitmq-data:
  redis-queue-data:
  
