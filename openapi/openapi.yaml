openapi: 3.0.4
info:
  title: Marketplace API
  description: |
    Products and orders for a small marketplace.
    Order lists use cursor pagination; order creation requires an Idempotency-Key.
    All errors are returned as application/problem+json (RFC 9457).
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

security: []

paths:
  /products/{id}:
    get:
      operationId: getProductById
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product to retrieve.
          schema:
            type: integer
      responses:
        '200':
          description: The requested product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /products/{id}/card:
    get:
      operationId: getProductCard
      summary: Get a product card with sales aggregates
      description: |
        Served from a cache (cache-aside, TTL 300–360 s), so the stock and the
        sales figures can be up to about 6 minutes old. Checkout always checks the
        real stock.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product.
          schema:
            type: integer
      responses:
        '200':
          description: The product card
          headers:
            X-Cache:
              description: HIT when served from the cache, MISS when read from the database.
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCard'
        '404':
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password; returns an access token and a refresh token
      description: |
        The access token is an ES256 JWT (10 minutes; header alg + kid; claims sub, jti,
        iat, exp, iss, aud, role). The refresh token is opaque (32 random bytes,
        base64url), valid 14 days; only its HMAC is stored, so it is returned once,
        here. An unknown email and a wrong password get the same 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Invalid body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Wrong email or password (the same answer for both)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Too many logins being checked at once (password hashing is capped); retry after the given seconds
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a refresh token for a new pair (rotation)
      description: |
        The presented refresh token is used up and replaced by a new one in the same
        family; the new access token carries the user's current role. Presenting a
        token that was already used revokes its whole family (reuse detection), so
        clients must never refresh the same token twice, nor in parallel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The new pair
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Invalid body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unknown, expired, revoked or already used refresh token (a reuse revokes the family)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/me:
    get:
      operationId: getMe
      summary: Who the access token says you are (what the guard put on req.user)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user, from the token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions:
    post:
      operationId: createSession
      summary: Start a session for a user (a stand-in for login)
      description: |
        Stores the session in Redis and returns its id only in the `sid` cookie
        (HttpOnly, SameSite=Lax, Secure in production). Any request carrying the
        cookie restarts the session's 30-minute idle timeout; it ends after 7 days
        whatever the activity. A session already on the request is replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: integer
                  minimum: 1
              required: [user_id]
      responses:
        '201':
          description: The session was created
          headers:
            Set-Cookie:
              description: sid=<session id>; Path=/; HttpOnly; SameSite=Lax; Max-Age=604800
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The session store is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /session:
    get:
      operationId: getSession
      summary: The current session (from the sid cookie), renewed by this request
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: No session cookie, or the session expired (the cookie is cleared)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The session store is unavailable (not a logout)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /products:
    get:
      operationId: listProducts
      summary: List all products
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: The request includes an unknown query parameter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{id}:
    get:
      operationId: getOrderById
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the order to retrieve.
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The requested order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of orders to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: >
            An opaque pagination token. Send back exactly the value received
            in the previous response's next_cursor to fetch the next page;
            never parse or construct this value yourself.
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          description: The cursor query parameter is malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createOrder
      summary: Create an order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            A client-generated v4 UUID that uniquely identifies this order
            creation attempt. Retrying the request with the same key and the
            same request body returns the original response instead of
            creating a second order.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      security:
        - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: >
            The created order. A retry with the same Idempotency-Key and body (from
            the same user) returns the same order, with Idempotent-Replayed: true.
          headers:
            Idempotent-Replayed:
              description: Present, set to true, when this response replays an earlier request with the same Idempotency-Key.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: The request body is invalid, or the Idempotency-Key header is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A product is unavailable or short of stock, or the user's balance doesn't cover the total
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The Idempotency-Key was already used (by the same user) with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      summary: Change an order's status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatus'
      security:
        - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The order with its new status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: The body is invalid (unknown status, extra fields)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The transition isn't allowed from the current status, or the order changed concurrently
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{id}/events:
    get:
      operationId: streamOrderEvents
      summary: Get order events by order ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the order
          schema:
            type: integer
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event the client received. The stream resends only events after it. Without it, the full history is sent first.
          schema: 
            type: integer
            minimum: 0
      security:
        - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: >
            An event stream. Each status change is an `order.status` event
            whose id is the order_events id and whose data is a JSON
            OrderStatusEvent. A `: ping` comment is sent every 15 s.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: The id or the Last-Event-ID header isn't a valid integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    # Enforced by the app's global guard (AccessTokenGuard), not by the request
    # validator (validateSecurity: false): one place decides, and it sends
    # WWW-Authenticate. Every operation that lists it needs a valid access token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (ES256)

  responses:
    Unauthorized:
      description: |
        No access token, or one that was rejected (bad signature, expired, wrong
        issuer or audience, unknown kid, an algorithm other than ES256).
      headers:
        WWW-Authenticate:
          description: '`Bearer` when no token was sent; `Bearer error="invalid_token"` when one was rejected (RFC 6750).'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        A valid access token, but this user may not do this (the role, or the order
        isn't theirs). Unlike 401, logging in again or refreshing won't help.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: >
        Rate limited: at most 5 requests per 10 seconds per client (the session's
        user, otherwise the IP address) on this route, over a sliding window.
      headers:
        Retry-After:
          description: Whole seconds until a request would pass again; at least 1.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
        - detail
        - instance

    Product:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        price_cents:
          type: integer
        in_stock:
          type: boolean
      required:
        - id
        - title
        - price_cents
        - in_stock

    ProductCard:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        stock:
          type: integer
        in_stock:
          type: boolean
        sales:
          description: Over all orders of the product except cancelled ones.
          type: object
          additionalProperties: false
          properties:
            units_sold:
              type: integer
            orders:
              type: integer
            buyers:
              type: integer
            revenue_cents:
              type: integer
            units_sold_30d:
              type: integer
            last_ordered_at:
              type: string
              format: date-time
              nullable: true
          required: [units_sold, orders, buyers, revenue_cents, units_sold_30d, last_ordered_at]
        bought_together:
          description: Up to 3 products most often bought in the same orders.
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              product_id:
                type: integer
              title:
                type: string
              orders:
                type: integer
            required: [product_id, title, orders]
      required: [id, title, description, price_cents, stock, in_stock, sales, bought_together]

    AuthUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        role:
          type: string
          enum: [customer, seller, admin]
        jti:
          type: string
        exp:
          description: Seconds since the epoch.
          type: integer
      required: [id, role, jti, exp]

    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256
      required: [refreshToken]

    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required: [email, password]

    TokenPair:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          description: 'ES256 JWT, sent as `Authorization: Bearer <token>`.'
          type: string
        refreshToken:
          description: Opaque; exchanged for a new pair (it is not a JWT).
          type: string
        expiresIn:
          description: The access token's lifetime, in seconds.
          type: integer
      required: [accessToken, refreshToken, expiresIn]

    Session:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        idle_ttl_seconds:
          description: The session ends after this long without a request.
          type: integer
        expires_at:
          description: The absolute end, whatever the activity.
          type: string
          format: date-time
      required: [user_id, created_at, idle_ttl_seconds, expires_at]

    OrderItem:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
        - product_id
        - quantity

    Order:
      type: object
      properties:
        id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1
        total_cents:
          type: integer
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - items
        - total_cents
        - status
        - created_at

    CreateOrder:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: integer
          description: The user who places the order and is charged for it.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1
      required:
        - user_id
        - items

    OrderPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
      required:
        - items
        - next_cursor
    # The one copy of the status list in the spec. It must match ORDER_STATUSES in
    # src/entities/order.entity.ts, which also drives the database CHECK constraint.
    OrderStatus:
      type: string
      enum: [paid, processing, shipped, out_for_delivery, delivered, cancelled]

    UpdateOrderStatus:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
      required:
        - status
