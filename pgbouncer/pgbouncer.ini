;; PgBouncer — the app's runtime connection (DB_URL) goes through here.
;; Migrations, seed and admin work (MIGRATIONS_DB_URL) connect to Postgres directly.

[databases]
;; Clients ask for "shop"; PgBouncer connects to the db service on the compose network.
shop = host=db port=5432 dbname=shop

[pgbouncer]
;; Without listen_addr PgBouncer listens on its Unix socket only — nothing over TCP.
listen_addr = 0.0.0.0
;; Must equal the container side of the port mapping in docker-compose.yml.
listen_port = 6432

;; A server connection is lent to a client for one transaction, then returned.
;; Session state (SET, advisory locks, LISTEN) doesn't survive between transactions.
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200

;; Passwords are looked up in Postgres per login (auth_query), not stored here,
;; so rotating app_user's password needs no PgBouncer step. auth_user is the one
;; role PgBouncer logs in as to run the lookup; its password is in auth_file.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

;; The console ("pgbouncer" database: SHOW POOLS, RELOAD) has no Postgres behind
;; it to run auth_query against, so its admin must be in auth_file.
admin_users = pgbouncer_admin
